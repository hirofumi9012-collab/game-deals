<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME DEALS PASS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0d0d;
      color: #ffffff;
      padding: 20px 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    /* ヘッダー */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      background: #107c41;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #000;
      font-size: 20px;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
    }

    /* ハード切り替えタブ */
    .platform-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .platform-tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      background: #1c1c1c;
      border: 1px solid #2a2a2a;
      color: #aaa;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #107c41;
      color: #fff;
      border-color: #107c41;
      box-shadow: 0 0 12px rgba(16, 124, 65, 0.6);
    }

    /* セクションタイトル */
    .section-label {
      font-size: 12px;
      font-weight: 800;
      color: #107c41;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* ゲームカード */
    .deals-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .deal-card {
      background: #181818;
      border: 1px solid #282828;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }
    .deal-card:active {
      transform: scale(0.98);
      border-color: #107c41;
    }

    /* ゲーム公式イラスト・バナー */
    .game-banner-container {
      width: 100%;
      height: 140px;
      background: #111;
      position: relative;
      overflow: hidden;
    }
    .game-banner {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* イチオシ枠用バッジ */
    .featured-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #107c41;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .card-content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .game-title {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.3;
      color: #fff;
    }

    .store-badge {
      font-size: 10px;
      font-weight: 800;
      color: #888;
      background: #222;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      align-self: flex-start;
    }

    /* ジャンル ＆ 簡単紹介文 (イチオシ枠用) */
    .featured-info {
      background: #222;
      border-left: 3px solid #107c41;
      padding: 8px 10px;
      border-radius: 0 6px 6px 0;
      font-size: 12px;
      color: #ccc;
      line-height: 1.4;
    }
    .featured-genre {
      font-weight: 800;
      color: #107c41;
      margin-bottom: 2px;
      font-size: 11px;
    }

    /* 価格セクション */
    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid #222;
    }

    .discount-badge {
      background: #107c41;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .price-block {
      text-align: right;
    }
    .current-price {
      font-size: 18px;
      font-weight: 900;
      color: #fff;
    }
    .original-price {
      font-size: 11px;
      color: #666;
      text-decoration: line-through;
    }

    .loading-status {
      text-align: center;
      color: #666;
      padding: 60px 0;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="brand-header">
    <div class="brand-icon">✕</div>
    <div class="brand-title">GAME DEALS PASS</div>
  </div>

  <!-- 公式表記タブ（並び順確定） -->
  <div class="platform-tabs">
    <button class="tab-btn active" onclick="changePlatform('switch', this)">Nintendo Switch</button>
    <button class="tab-btn" onclick="changePlatform('psn', this)">PlayStation</button>
    <button class="tab-btn" onclick="changePlatform('xbox', this)">Xbox</button>
    <button class="tab-btn" onclick="changePlatform('steam', this)">Steam</button>
    <button class="tab-btn" onclick="changePlatform('epic', this)">Epic Games</button>
    <button class="tab-btn" onclick="changePlatform('free', this)">無料ゲーム</button>
  </div>

  <div class="section-label" id="sectionTitle">DEALS & OFFERS</div>

  <div id="dealsContainer" class="deals-grid">
    <div class="loading-status">セール情報を取得中...</div>
  </div>

  <script>
    // CheapShark Store ID マッピング
    const STORES = {
      switch: { id: '13', name: 'Nintendo Switch' },
      psn:    { id: '2',  name: 'PlayStation' },
      xbox:   { id: '3',  name: 'Xbox' },
      steam:  { id: '1',  name: 'Steam' },
      epic:   { id: '25', name: 'Epic Games' }
    };

    // イチオシ枠（紹介文・ジャンル付きピックアップ例）
    const FEATURED_GAMES = {
      switch: {
        title: "ゼルダの伝説 ティアーズ オブ ザ キングダム",
        genre: "アクション / アドベンチャー",
        desc: "どこまでも続く果てしない世界。空と大地を駆け巡り、自分だけの冒険を紡ぎ出そう。",
        image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80"
      },
      psn: {
        title: "FINAL FANTASY VII REBIRTH",
        genre: "RPG",
        desc: "未知なる旅は続く。広大な世界を舞台に展開する新たな物語と圧倒的バトル体験！",
        image: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=600&q=80"
      },
      xbox: {
        title: "Forza Horizon 5",
        genre: "オープンワールドレーシング",
        desc: "鮮やかなメキシコを駆け抜けよう！数百台の名車で迫力満点のマシンバトル。",
        image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=600&q=80"
      },
      steam: {
        title: "Cyberpunk 2077",
        genre: "オープンワールドRPG",
        desc: "巨大都市ナイトシティを駆け巡る。独自のボディカスタマイズで自分だけのサイバーパンクへ。",
        image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80"
      },
      epic: {
        title: "Alan Wake 2",
        genre: "サイコホラー / サバイバル",
        desc: "二人のヒーロー、二つの現実。現実を書き換える超自然的な恐怖に挑め。",
        image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80"
      }
    };

    function loadDeals(platform) {
      const container = document.getElementById('dealsContainer');
      const sectionTitle = document.getElementById('sectionTitle');
      container.innerHTML = '<div class="loading-status">セール情報を取得中...</div>';

      if (platform === 'free') {
        sectionTitle.textContent = '100% OFF (期間限定無料)';
        loadFreeGames();
        return;
      }

      sectionTitle.textContent = `${platform.toUpperCase()} DEALS & OFFERS`;
      const store = STORES[platform] || STORES.switch;
      const API_URL = `https://www.cheapshark.com/api/1.0/deals?storeID=${store.id}&sortBy=Savings&pageSize=15`;

      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          container.innerHTML = '';

          // イチオシ枠のカードを先頭に追加（紹介文＋ジャンル付き）
          if (FEATURED_GAMES[platform]) {
            const feat = FEATURED_GAMES[platform];
            const featCard = document.createElement('div');
            featCard.className = 'deal-card';
            featCard.innerHTML = `
              <div class="game-banner-container">
                <span class="featured-badge">今週のイチオシ</span>
                <img class="game-banner" src="${feat.image}" alt="${feat.title}">
              </div>
              <div class="card-content">
                <div class="card-top-row">
                  <div class="game-title">${cleanText(feat.title)}</div>
                  <span class="store-badge">${store.name}</span>
                </div>
                <div class="featured-info">
                  <div class="featured-genre">${feat.genre}</div>
                  <div>${feat.desc}</div>
                </div>
                <div class="price-row">
                  <div class="discount-badge">RECOMMENDED</div>
                  <div class="price-block">
                    <div class="current-price">公式ストアで確認</div>
                  </div>
                </div>
              </div>
            `;
            container.appendChild(featCard);
          }

          if (Array.isArray(data) && data.length > 0) {
            data.forEach(item => {
              const title = item.title;
              const discount = Math.round(parseFloat(item.savings));
              const price = Math.round(parseFloat(item.salePrice) * 150);
              const regular = Math.round(parseFloat(item.normalPrice) * 150);
              const dealUrl = `https://www.cheapshark.com/redirect?dealID=${item.dealID}`;
              const bannerImg = item.thumb || '';

              const card = document.createElement('a');
              card.className = 'deal-card';
              card.href = dealUrl;
              card.target = '_blank';

              card.innerHTML = `
                ${bannerImg ? `
                  <div class="game-banner-container">
                    <img class="game-banner" src="${bannerImg}" alt="${cleanText(title)}" onerror="this.style.display='none'">
                  </div>
                ` : ''}
                <div class="card-content">
                  <div class="card-top-row">
                    <div class="game-title">${cleanText(title)}</div>
                    <span class="store-badge">${store.name}</span>
                  </div>
                  <div class="price-row">
                    <div class="discount-badge">-${discount}%</div>
                    <div class="price-block">
                      <div class="current-price">¥${price.toLocaleString()}</div>
                      <div class="original-price">¥${regular.toLocaleString()}</div>
                    </div>
                  </div>
                </div>
              `;
              container.appendChild(card);
            });
          } else {
            container.innerHTML += '<div class="loading-status">現在セール情報がありません</div>';
          }
        })
        .catch(() => {
          container.innerHTML = '<div class="loading-status">情報の取得に失敗しました</div>';
        });
    }

    // 期間限定100%OFF無料ゲームの読み込み
    function loadFreeGames() {
      const container = document.getElementById('dealsContainer');
      const API_URL = `https://www.cheapshark.com/api/1.0/deals?upperPrice=0&sortBy=Savings&pageSize=15`;

      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          // 100%OFFの期間限定無料ゲームのみフィルタリング（元の価格が0より大きい有料ゲーム）
          const trueFreeGames = data.filter(item => parseFloat(item.normalPrice) > 0);

          if (trueFreeGames.length > 0) {
            container.innerHTML = '';
            trueFreeGames.forEach(item => {
              const title = item.title;
              const regular = Math.round(parseFloat(item.normalPrice) * 150);
              const dealUrl = `https://www.cheapshark.com/redirect?dealID=${item.dealID}`;
              const bannerImg = item.thumb || '';

              const card = document.createElement('a');
              card.className = 'deal-card';
              card.href = dealUrl;
              card.target = '_blank';

              card.innerHTML = `
                ${bannerImg ? `
                  <div class="game-banner-container">
                    <img class="game-banner" src="${bannerImg}" alt="${cleanText(title)}" onerror="this.style.display='none'">
                  </div>
                ` : ''}
                <div class="card-content">
                  <div class="card-top-row">
                    <div class="game-title">${cleanText(title)}</div>
                    <span class="store-badge">期間限定無料</span>
                  </div>
                  <div class="price-row">
                    <div class="discount-badge" style="background:#107c41;">100% OFF</div>
                    <div class="price-block">
                      <div class="current-price" style="color:#107c41;">¥0</div>
                      <div class="original-price">¥${regular.toLocaleString()}</div>
                    </div>
                  </div>
                </div>
              `;
              container.appendChild(card);
            });
          } else {
            container.innerHTML = '<div class="loading-status">現在100% OFFの期間限定無料ゲームはありません</div>';
          }
        })
        .catch(() => {
          container.innerHTML = '<div class="loading-status">情報の取得に失敗しました</div>';
        });
    }

    function changePlatform(platform, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadDeals(platform);
    }

    function cleanText(str) {
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[match]);
    }

    // 初期起動（Nintendo Switchから表示）
    loadDeals('switch');
  </script>
</body>
</html>
